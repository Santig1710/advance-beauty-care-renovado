{% extends 'base.html' %}
{% block title %}Acceso administrador | Advance Beauty Care{% endblock %}
{% block body %}<main class="flex min-h-screen items-center justify-center px-5 py-12"><section class="w-full max-w-md bg-white p-8 shadow-sm sm:p-10"><a href="/" class="text-[10px] font-semibold uppercase tracking-[.22em] text-rose">Advance Beauty Care</a><h1 class="display mt-7 text-3xl">Panel de administración</h1><p class="mt-2 text-sm text-stone-500">Ingresá con tus credenciales para continuar.</p><form method="post" class="mt-8 space-y-5"><label class="block text-xs text-stone-600">Usuario<input name="username" required autocomplete="username" class="mt-2 w-full border border-line px-4 py-3 text-sm"></label><label class="block text-xs text-stone-600">Contraseña<input name="password" type="password" required autocomplete="current-password" class="mt-2 w-full border border-line px-4 py-3 text-sm"></label><button class="w-full bg-ink px-5 py-4 text-xs text-white hover:bg-rose">Ingresar</button></form><a href="/" class="mt-6 inline-block text-xs text-stone-500 hover:text-ink">← Volver al sitio</a></section></main>{% endblock %}
