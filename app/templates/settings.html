{% extends 'base.html' %}
{% block title %}Personalización | Advance Beauty Care{% endblock %}
{% block body %}<main class="mx-auto max-w-3xl px-5 py-10 md:py-14"><a href="{{ url_for('main.admin_dashboard') }}" class="text-xs text-stone-500 hover:text-ink">← Volver al panel</a><p class="mt-7 text-[10px] font-semibold uppercase tracking-[.2em] text-rose">Contenido y preferencias</p><h1 class="display mt-2 text-4xl">Personalizá tu sitio</h1><form method="post" class="mt-8 space-y-7 bg-white p-6 sm:p-8"><section><h2 class="display text-xl">Portada</h2><div class="mt-4 space-y-4"><label class="block text-xs text-stone-600">Título principal<input name="hero_title" value="{{ settings.get('hero_title', '') }}" class="mt-2 w-full border border-line px-4 py-3 text-sm"></label><label class="block text-xs text-stone-600">Texto de portada<textarea name="hero_subtitle" rows="2" class="mt-2 w-full border border-line px-4 py-3 text-sm">{{ settings.get('hero_subtitle', '') }}</textarea></label><label class="block text-xs text-stone-600">Imágenes del carrusel, una URL https:// por línea<textarea name="hero_images" rows="4" class="mt-2 w-full border border-line px-4 py-3 text-sm">{{ settings.get('hero_images', '') }}</textarea></label></div></section><section class="border-t border-line pt-6"><h2 class="display text-xl">Horarios disponibles</h2><p class="mt-1 text-xs text-stone-500">Los turnos se ofrecen cada 30 minutos dentro de esta franja.</p><div class="mt-4 grid gap-4 sm:grid-cols-2"><label class="text-xs text-stone-600">Desde<input name="opening_hour" type="number" min="0" max="23" required value="{{ settings.get('opening_hour', '9') }}" class="mt-2 w-full border border-line px-4 py-3 text-sm"></label><label class="text-xs text-stone-600">Hasta<input name="closing_hour" type="number" min="1" max="24" required value="{{ settings.get('closing_hour', '20') }}" class="mt-2 w-full border border-line px-4 py-3 text-sm"></label></div></section><section class="border-t border-line pt-6"><h2 class="display text-xl">WhatsApp</h2><div class="mt-4 space-y-4"><label class="block text-xs text-stone-600">Número de WhatsApp con código de país<input name="whatsapp_number" value="{{ settings.get('whatsapp_number', '') }}" placeholder="5491112345678" class="mt-2 w-full border border-line px-4 py-3 text-sm"></label><label class="block text-xs text-stone-600">Plantilla del mensaje<textarea name="whatsapp_template" rows="7" class="mt-2 w-full border border-line px-4 py-3 font-mono text-xs leading-6">{{ settings.get('whatsapp_template', '') }}</textarea><span class="mt-2 block text-[10px] leading-5 text-stone-400">Variables: {machine}, {journey}, {date}, {time}, {name}, {phone}, {email}, {business}, {price}, {notes}.</span></label></div></section><button class="bg-ink px-6 py-4 text-xs text-white hover:bg-rose">Guardar cambios</button></form></main>{% endblock %}
